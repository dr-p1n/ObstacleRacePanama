<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial Black, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241408"/>
      <stop offset="55%" stop-color="#1a0f07"/>
      <stop offset="100%" stop-color="#120a04"/>
    </linearGradient>
    <radialGradient id="warm" cx="78%" cy="40%" r="55%">
      <stop offset="0" stop-color="#4f3119" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4f3119" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <!-- emblem -->
  <image href="logo.png" x="720" y="95" width="420" height="420"/>

  <!-- left copy -->
  <text x="80" y="150" fill="#c69a6a" font-size="22" font-weight="700" letter-spacing="7" font-family="Arial, sans-serif">PANAMÁ · PRÓXIMAMENTE</text>

  <text x="76" y="272" fill="#ffffff" font-size="66" font-weight="900" letter-spacing="-1">CONQUISTA</text>
  <text x="76" y="342" fill="#ffffff" font-size="66" font-weight="900" letter-spacing="-1">LA RUTA.</text>
  <text x="76" y="430" fill="#d8412f" font-size="52" font-weight="900" letter-spacing="-1">CONVIÉRTETE</text>
  <text x="76" y="492" fill="#d8412f" font-size="52" font-weight="900" letter-spacing="-1">EN O'RACER.</text>

  <!-- flag rule -->
  <rect x="80" y="196" width="150" height="7" rx="3" fill="#c0392b"/>
  <rect x="230" y="196" width="150" height="7" rx="3" fill="#f6efe4"/>
  <rect x="380" y="196" width="150" height="7" rx="3" fill="#21386e"/>

  <!-- footer strip -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#3d2513" stroke-width="1.5"/>
  <text x="80" y="596" fill="#9a744c" font-size="18" font-weight="700" letter-spacing="3" font-family="Arial, sans-serif">POWERED BY ECOFIT × PANAMA SPORTS MAGAZINE</text>
  <text x="1120" y="596" fill="#9a744c" font-size="18" font-weight="700" letter-spacing="3" font-family="Arial, sans-serif" text-anchor="end">obstacleracepanama.com</text>
</svg>
