<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="Arial Black, Impact, sans-serif">
  <defs>
    <radialGradient id="disc" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#3a2413"/>
      <stop offset="70%" stop-color="#241408"/>
      <stop offset="100%" stop-color="#160c05"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c69a6a"/>
      <stop offset="1" stop-color="#7a4f28"/>
    </linearGradient>
    <path id="topArc" d="M 60,300 A 240,240 0 0 1 540,300" fill="none"/>
    <path id="botArc" d="M 82,300 A 218,218 0 0 0 518,300" fill="none"/>
  </defs>

  <circle cx="300" cy="300" r="296" fill="#160c05"/>
  <circle cx="300" cy="300" r="288" fill="none" stroke="url(#ring)" stroke-width="9"/>
  <circle cx="300" cy="300" r="272" fill="url(#disc)"/>
  <circle cx="300" cy="300" r="214" fill="none" stroke="#7a4f28" stroke-width="2.5" opacity="0.8"/>

  <text font-size="52" font-weight="900" letter-spacing="4" fill="#f6efe4">
