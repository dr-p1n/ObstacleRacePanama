  <!-- Panama flag ribbon accents -->
  <rect x="40" y="292" width="60" height="16" rx="3" fill="#21386e"/>
  <rect x="500" y="292" width="60" height="16" rx="3" fill="#c0392b"/>

  <!-- center gritty mark: obstacle wall + mountain -->
  <g transform="translate(300,268)" fill="none" stroke="#c69a6a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-118,54 L-46,-58 L2,-6 L44,-64 L120,54 Z" fill="#2b1a0e"/>
    <path d="M-92,54 L-46,-18 L-16,20"/>
    <line x1="-150" y1="70" x2="150" y2="70"/>
    <line x1="-110" y1="88" x2="110" y2="88"/>
  </g>
  <circle cx="344" cy="204" r="9" fill="#c0392b"/>

  <!-- tagline band -->
  <text x="300" y="392" font-size="18" font-weight="700" letter-spacing="2" fill="#c69a6a" text-anchor="middle">CONQUER THE COURSE · BECOME AN O'RACER</text>
  <text x="300" y="470" font-size="15" font-weight="700" letter-spacing="3" fill="#8a6a48" text-anchor="middle">★ WWW.OBSTACLERACEPANAMA.COM ★</text>
